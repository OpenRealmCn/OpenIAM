server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug" # debug | release
  cors_allow_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

mysql:
  dsn: "openiam:openiam_password@tcp(127.0.0.1:3306)/openiam?charset=utf8mb4&parseTime=True&loc=Local&multiStatements=true"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime_minutes: 60

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  key_prefix: "openiam:"

jwt:
  issuer: "http://localhost:8080"
  private_key_path: "" # 留空则在启动时自动生成 2048-bit RSA 密钥对；生产环境建议配置 PEM 文件路径
  access_token_ttl_minutes: 30
  refresh_token_ttl_hours: 168 # 7 天

ratelimit:
  enabled: true
  general_rate: "120-M" # 通用 API 每分钟每 IP 120 次
  auth_rate: "15-M"     # 登录/注册/回调等认证端点每分钟每 IP 15 次

security:
  max_login_failures: 5
  lockout_minutes: 15

migration:
  auto_migrate: true
  strict_version_check: true

oauth_server:
  issuer: "http://localhost:8080"
  frontend_consent_url: "http://localhost:5173/oauth2/consent"
  auth_code_ttl_minutes: 10
  access_token_ttl_minutes: 60
  refresh_token_ttl_hours: 720 # 30 天

oauth_plugin:
  callback_base_url: "http://localhost:5173/oauth/callback"

seed:
  enabled: true
  admin_username: "admin"
  admin_email: "admin@openrealm.local"
  admin_password: "Admin@123456"
